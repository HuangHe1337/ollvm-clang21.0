name: Build OLLVM (RTTI + Export Dynamic) - Fix Plugins

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Clang (RTTI+FullExport)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Setup Swap (16GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential xz-utils

      - name: Setup NDK
        run: |
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV

      - name: Configure CMake (The Ultimate Fix)
        run: |
          mkdir -p build
          
          # === 核心修复参数 ===
          # 1. LLVM_ENABLE_RTTI=ON : 开启 RTTI，解决 _ZTI (typeinfo) 报错
          # 2. CMAKE_EXE_LINKER_FLAGS="-Wl,--export-dynamic" : 暴力导出所有符号，解决 _ZTV (vtable) 报错
          # 3. LLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON : 配合上面的选项双重保险
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--export-dynamic" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build & Install
        run: |
          cmake --build build --target install -j$(nproc)

      - name: Cleanup Artifacts
        run: |
          cd install_output
          rm -rf lib/*.a 
          echo "Final Size:"
          du -sh .

      - name: Compress and Split
        run: |
          tar -cf - -C install_output . | xz -9e -T0 | split -b 400M - "ollvm-android.tar.xz."
          ls -lh ollvm-android.tar.xz.*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-rtti-${{ github.run_number }}
          name: OLLVM (RTTI + Export Dynamic) Build ${{ github.run_number }}
          body: |
            Build of OLLVM for Android (AArch64) with Plugin Support fixes.
            
            **Fixes:**
            - **RTTI Enabled (`-DLLVM_ENABLE_RTTI=ON`)**: Fixes `dlopen failed: cannot locate symbol _ZTI...` (typeinfo).
            - **Export Dynamic (`-Wl,--export-dynamic`)**: Fixes `dlopen failed: cannot locate symbol _ZTV...` (vtable).
            - **Static Linking**: No dependencies on `libc++_shared.so`.
            
            **Usage:**
            Download all parts and run:
            `cat ollvm-android.tar.xz.* | tar -xJ`
          files: |
            ollvm-android.tar.xz.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
