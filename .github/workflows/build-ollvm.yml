name: Build OLLVM Android (Termux) - Fix Bus Error

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

jobs:
  build:
    name: Build AArch64 OLLVM
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space (Aggressive)
        run: |
          # 清理空间：移除 .NET, Android SDKs, CodeQL 等不必要组件
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Create Swap (16GB)
        run: |
          # 16GB Swap 平衡内存需求和磁盘空间
          # 如果 Swap 太大(20G+)，可能会挤占磁盘导致 Bus Error (Disk Full)
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=100

      - name: Checkout OLLVM Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential xz-utils

      - name: Download & Setup Android NDK
        id: setup-ndk
        run: |
          echo "Downloading NDK ${{ inputs.ndk_version }}..."
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV

      - name: Configure CMake (Memory Safe)
        run: |
          mkdir -p build
          
          # === 关键修复说明 ===
          # 1. LLVM_PARALLEL_LINK_JOBS=1 : 
          #    最重要的一行！强制一次只链接一个文件。
          #    防止 clang 和 llvm-objdump 同时链接导致内存爆炸。
          #
          # 2. CMAKE_CXX_FLAGS="-g0" :
          #    强制关闭调试信息。日志显示即使是 Release 模式 NDK 也可能加上 -g。
          #    去掉 -g 可以节省数 GB 的内存。
          #
          # 3. 之前的符号修复依然保留 (EXPORT_SYMBOLS + Static Link)。
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build OLLVM
        run: |
          # 这里依然可以用多核编译 (-j)，因为我们已经限制了 LINK_JOBS 为 1
          # Ninja 会自动管理：编译时全速，链接时排队。
          cmake --build build --target install -j$(nproc)

      - name: Cleanup & Prepare Artifacts
        run: |
          cd install_output
          rm -rf lib/*.a 
          echo "Size before compression:"
          du -sh .

      - name: Compress and Split (400MB Chunks)
        run: |
          tar -cf - -C install_output . | xz -9e -T0 | split -b 400M - "ollvm-bindist.tar.xz."
          ls -lh ollvm-bindist.tar.xz.*

      - name: Upload Artifacts (Split Parts)
        uses: actions/upload-artifact@v4
        with:
          name: ollvm-android-arm64-parts
          path: ollvm-bindist.tar.xz.*
          retention-days: 5
