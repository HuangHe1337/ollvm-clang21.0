name: Build OLLVM Android (Termux) - Stable

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version (e.g., r27c)"
        default: 'r27c'
        required: true

jobs:
  build:
    name: Build AArch64 OLLVM
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space & Create Swap
        run: |
          # 1. 清理预装软件释放磁盘空间 (为 Swap 腾位置)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          # 2. 创建 10GB 的 Swap 文件
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 3. 检查内存状态
          free -h

      - name: Checkout OLLVM Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential p7zip-full

      - name: Download & Setup Android NDK
        id: setup-ndk
        run: |
          echo "Downloading NDK ${{ inputs.ndk_version }}..."
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          
          TOOLCHAIN_BIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV

      - name: Configure CMake (Memory Optimized)
        run: |
          mkdir -p build
          
          # 修改点: 
          # 1. MinSizeRel: 省内存且体积小
          # 2. LLVM_PARALLEL_LINK_JOBS=1: 强制单线程链接，防止崩在最后一步
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build LLVM (Restricted Parallelism)
        run: |
          # 强制使用 -j2 (2个线程)。
          # 虽然 Github Runner 是2核，但开满由于IO等待通常能跑更快，
          # 可是为了省内存，必须限制在2甚至1。
          cmake --build build --target install --parallel 2

      - name: Strip Binaries
        run: |
          STRIP_TOOL=${{ env.TOOLCHAIN_BIN }}/llvm-strip
          find install_output/bin -type f -exec file {} \; | grep "ELF 64-bit" | cut -d: -f1 | xargs -r $STRIP_TOOL --strip-all || true

      - name: Pack and Split Artifacts
        run: |
          cd install_output
          7z a -t7z -mx=9 -v450m ../ollvm-aarch64-android.7z .
          cd ..
          ls -lh ollvm-aarch64-android.7z*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollvm-android-build
          path: ollvm-aarch64-android.7z*
          retention-days: 5

      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          name: "OLLVM Android Build ${{ inputs.ndk_version }}"
          tag: "v21.0-android-${{ github.run_number }}"
          artifacts: "ollvm-aarch64-android.7z*"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Optimized build for Termux (MinSizeRel).
            Source: lux-QAQ/ollvm-clang21.0