name: Build OLLVM (Clang & LLD Only) - Termux

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

jobs:
  build:
    name: Build Clang+LLD
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Setup Swap (16GB)
        run: |
          # 重置 Swap 防止 Text file busy
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential xz-utils

      - name: Setup NDK
        run: |
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV

      - name: Configure CMake (Clang & LLD Only)
        run: |
          mkdir -p build
          
          # === 配置详解 ===
          # 1. LLVM_ENABLE_PROJECTS="clang;lld" : 只开启 Clang 和 LLD
          # 2. LLVM_BUILD_TOOLS=OFF             : 不构建 llvm-objdump/bugpoint 等杂项 (解决报错的关键)
          # 3. LLVM_INCLUDE_UTILS=OFF           : 不构建辅助工具
          # 4. LLVM_EXPORT_SYMBOLS...=ON        : 强制导出符号 (解决 dlopen 报错)
          # 5. LLVM_PARALLEL_LINK_JOBS=1        : 防止内存溢出
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build & Install
        run: |
          # 仅编译安装配置好的组件 (Clang + LLD)
          cmake --build build --target install -j$(nproc)

      - name: Cleanup Artifacts
        run: |
          cd install_output
          # 删除静态库 (.a) 减小体积，只保留二进制和 .so
          rm -rf lib/*.a 
          
          echo "Final Size:"
          du -sh .

      - name: Compress and Split
        run: |
          # xz 极限压缩 + 400MB 分卷
          tar -cf - -C install_output . | xz -9e -T0 | split -b 400M - "ollvm-bindist.tar.xz."
          ls -lh ollvm-bindist.tar.xz.*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollvm-android-arm64-parts
          path: ollvm-bindist.tar.xz.*
          retention-days: 5
