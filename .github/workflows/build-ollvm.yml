name: Build OLLVM Android (Termux) - Fix Symbols & Split 400M

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

jobs:
  build:
    name: Build AArch64 OLLVM
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space (Aggressive)
        run: |
          # 清理空间：移除 .NET, Android SDKs, CodeQL 等不必要组件
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Create Massive Swap (20GB)
        run: |
          # 20GB Swap 防止链接阶段内存溢出
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=100

      - name: Checkout OLLVM Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential xz-utils

      - name: Download & Setup Android NDK
        id: setup-ndk
        run: |
          echo "Downloading NDK ${{ inputs.ndk_version }}..."
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV

      - name: Configure CMake (Fix Symbols & Plugins)
        run: |
          mkdir -p build
          
          # 关键参数解释:
          # LLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON : 导出主程序符号，解决 dlopen 报错
          # CMAKE_INSTALL_DO_STRIP=OFF         : 禁止安装时剥离符号
          # LLVM_BUILD_LLVM_DYLIB=ON           : 编译 libLLVM.so 动态库
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build OLLVM
        run: |
          # 编译并安装到 install_output 目录
          cmake --build build --target install -j$(nproc)

      - name: Cleanup & Prepare Artifacts
        run: |
          cd install_output
          
          # 可选：删除静态库(.a)以减小体积，但保留 .so 和 可执行文件
          # 强烈建议保留 libLLVM.so，因为插件可能依赖它
          # rm -rf lib/*.a 
          
          echo "Size before compression:"
          du -sh .

      - name: Compress and Split (400MB Chunks)
        run: |
          # 使用 tar 打包 -> xz 极限压缩 -> split 分割
          # -C install_output . : 进入目录打包，解压时不会带 install_output 父文件夹
          # -b 400M : 每个分卷最大 400MB
          
          tar -cf - -C install_output . | xz -9e -T0 | split -b 400M - "ollvm-bindist.tar.xz."
          
          echo "Generated Parts:"
          ls -lh ollvm-bindist.tar.xz.*

      - name: Upload Artifacts (Split Parts)
        uses: actions/upload-artifact@v4
        with:
          name: ollvm-android-arm64-parts
          path: ollvm-bindist.tar.xz.*
          retention-days: 5
