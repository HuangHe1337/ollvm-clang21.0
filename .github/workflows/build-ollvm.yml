name: Build OLLVM (DYLIB + Wrapper) - The Final Fix

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Clang (DYLIB+Wrapper)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force

      - name: Setup Swap (16GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential xz-utils

      - name: Setup NDK
        run: |
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV

      - name: Configure CMake (DYLIB Mode)
        run: |
          mkdir -p build
          
          # === 策略说明 ===
          # 1. 开启 DYLIB: 生成 libLLVM.so 和 libclang-cpp.so。这包含了所有符号，绝不会报 symbol missing。
          # 2. 静态 STL: 避免依赖 libc++_shared.so。
          # 3. 插件支持: 开启 RTTI 和 Plugin 支持。
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build & Install
        run: |
          cmake --build build --target install -j$(nproc)

      - name: Create Wrapper Scripts
        run: |
          cd install_output/bin
          
          # === 创建启动脚本 ===
          # 既然 RPATH 在某些环境下不稳定，我们直接生成一个 wrapper 脚本。
          # 这个脚本会自动把 ../lib 目录加入 LD_LIBRARY_PATH，确保 100% 能找到库。
          
          # 重命名原文件
          mv clang clang.real
          mv clang++ clang++.real
          
          # 创建 clang 脚本
          cat <<EOF > clang
          #!/bin/sh
          # 获取脚本所在目录的上一级目录下的 lib
          DIR=\$(cd "\$(dirname "\$0")"; pwd)
          ROOT_DIR=\$(dirname "\$DIR")
          export LD_LIBRARY_PATH="\$ROOT_DIR/lib:\$ROOT_DIR/lib64:\$LD_LIBRARY_PATH"
          exec "\$DIR/clang.real" "\$@"
          EOF
          
          # 创建 clang++ 脚本
          cat <<EOF > clang++
          #!/bin/sh
          DIR=\$(cd "\$(dirname "\$0")"; pwd)
          ROOT_DIR=\$(dirname "\$DIR")
          export LD_LIBRARY_PATH="\$ROOT_DIR/lib:\$ROOT_DIR/lib64:\$LD_LIBRARY_PATH"
          exec "\$DIR/clang++.real" "\$@"
          EOF
          
          chmod +x clang clang++
          
          echo "Wrapper scripts created."

      - name: Cleanup Artifacts
        run: |
          cd install_output
          rm -rf lib/*.a 
          echo "Final Size:"
          du -sh .

      - name: Compress and Split
        run: |
          tar -cf - -C install_output . | xz -9e -T0 | split -b 400M - "ollvm-wrapper.tar.xz."
          ls -lh ollvm-wrapper.tar.xz.*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-wrapper-${{ github.run_number }}
          name: "OLLVM (DYLIB + Wrapper) Build ${{ github.run_number }}"
          body: |
            Build of OLLVM for Android (AArch64) with **Wrapper Scripts**.
            
            **Why this version?**
            - **Fixes `symbol not found`**: Uses `libLLVM.so` / `libclang-cpp.so` which contain ALL symbols (including `noteBottomOfStack`).
            - **Fixes `library not found`**: Includes `clang` and `clang++` wrapper scripts that auto-set `LD_LIBRARY_PATH`.
            
            **Installation:**
            1. Extract to a folder.
            2. Copy `bin/` and `lib/` to your NDK or Termux location.
            3. **Use `bin/clang` directly**. It is a script that sets up the environment and calls `bin/clang.real`.
          files: |
            ollvm-wrapper.tar.xz.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
