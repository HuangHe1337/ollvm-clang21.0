name: Build OLLVM (Nuclear Option) - Visibility Default

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Clang (Nuclear Config)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune --all --force

      - name: Setup Swap (16GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential xz-utils

      - name: Setup NDK
        run: |
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV

      - name: Configure CMake (The Nuclear Fix)
        run: |
          mkdir -p build
          
          # === 核弹级修复逻辑 ===
          # 1. 回归静态链接 (Static): 避免 .so 符号隐藏问题，所有代码打入 clang。
          # 2. CMAKE_CXX_FLAGS="-fvisibility=default": 核心！强制所有 C++ 类可见，解决 _ZTV (vtable) 缺失。
          # 3. CMAKE_EXE_LINKER_FLAGS="-Wl,--export-dynamic": 核心！强制导出主程序符号给插件 dlopen 用。
          # 4. LLVM_ENABLE_RTTI=ON: 解决插件的 dynamic_cast / typeid 报错。
          # 5. ANDROID_STL=c++_static: 解决 libc++_shared 找不到的问题。
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG -fvisibility=default" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG -fvisibility=default" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--export-dynamic" \
            \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build & Install
        run: |
          # 静态链接+全符号导出，链接时间会较长，请耐心等待
          cmake --build build --target install -j$(nproc)

      - name: Cleanup Artifacts
        run: |
          cd install_output
          # 删除静态库，因为我们已经把逻辑都打进 clang 二进制了
          rm -rf lib/*.a 
          
          echo "Final Size:"
          du -sh .

      - name: Compress and Split
        run: |
          # 静态链接的 clang 二进制文件会比较大，这是正常的
          tar -cf - -C install_output . | xz -9e -T0 | split -b 400M - "ollvm-nuclear.tar.xz."
          ls -lh ollvm-nuclear.tar.xz.*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-nuclear-${{ github.run_number }}
          name: OLLVM (Nuclear: Visibility Default) Build ${{ github.run_number }}
          body: |
            Build of OLLVM for Android (AArch64) with **Maximum Compatibility**.
            
            **Fixes Applied:**
            - **`libxVMP.so` Fix**: `-fvisibility=default` ensures `IRBuilder` vtables are visible.
            - **`libSkeletonPass.so` Fix**: `-Wl,--export-dynamic` forces `clang` to share all symbols with plugins.
            - **Run Requirements**: Fully Static Build. No external `.so` needed (except system libs).
            
            **Installation:**
            1. Download and extract.
            2. Copy `bin/*` to your NDK `bin/`.
            3. No `libLLVM.so` needed, clang is standalone.
          files: |
            ollvm-nuclear.tar.xz.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
