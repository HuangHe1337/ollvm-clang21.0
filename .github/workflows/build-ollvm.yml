name: Build OLLVM Android (Termux) - TarXZ Fix

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

jobs:
  build:
    name: Build AArch64 OLLVM
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space (Aggressive)
        run: |
          # 清理空间以防万一
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Create Massive Swap (20GB)
        run: |
          # 20GB Swap 防止编译崩盘
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=100

      - name: Checkout OLLVM Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential

      - name: Download & Setup Android NDK
        id: setup-ndk
        run: |
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "TOOLCHAIN_BIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV

      - name: Configure CMake (Safe Mode)
        run: |
          mkdir -p build
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_C_FLAGS="-g0 -O3" \
            -DCMAKE_CXX_FLAGS="-g0 -O3" \
            -DCMAKE_ASM_FLAGS="-g0" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_BACKTRACES=OFF \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build LLVM (Safe Parallelism)
        run: |
          cmake --build build --target install --parallel 2

      - name: Pack and Split Artifacts (Tar+XZ)
        run: |
          cd install_output
          echo "Compressing and Splitting..."
          # 1. tar: 打包，保留软链接和权限
          # 2. xz -T0: 使用所有核心进行高压缩
          # 3. split: 切割成 450MB 的小文件，命名为 ollvm.tar.xz.aa, ollvm.tar.xz.ab ...
          tar -cf - . | xz -T0 -9 | split -b 450M - ../ollvm-aarch64-android.tar.xz.
          
          cd ..
          ls -lh ollvm-aarch64-android.tar.xz.*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ollvm-android-build
          path: ollvm-aarch64-android.tar.xz.*
          retention-days: 5

      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          name: "OLLVM Android Build ${{ inputs.ndk_version }}"
          tag: "v21.0-android-${{ github.run_number }}"
          artifacts: "ollvm-aarch64-android.tar.xz.*"
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bulletproof build for Termux.
            Format: .tar.xz (Split).
            
            **How to install in Termux:**
            1. Download all parts (`.aa`, `.ab`, etc.) to one folder.
            2. Run this command to combine and extract:
            ```bash
            cat ollvm-aarch64-android.tar.xz.* | tar -xJf -
            ```
