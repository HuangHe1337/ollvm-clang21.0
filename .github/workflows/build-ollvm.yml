name: Build OLLVM (Intel/Hackintosh Ultimate)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Intel Toolchain (Patched)
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          brew install ninja cmake
          
      - name: Patch Clang Source (Magic Fix)
        run: |
          # ！！！核心魔法步骤！！！
          # 修改 Clang 的参数定义文件，强行添加 Apple 私有参数 '-index-store-path'
          # 这样 Xcode 传参时，Clang 就不会报 "unknown argument" 错误了
          
          OPTIONS_FILE="llvm-project/clang/include/clang/Driver/Options.td"
          
          echo "" >> "$OPTIONS_FILE"
          echo "// === PATCH FOR XCODE SUPPORT ===" >> "$OPTIONS_FILE"
          echo 'def index_store_path : Separate<["-"], "index-store-path">, Flags<[HelpHidden]>;' >> "$OPTIONS_FILE"
          
          echo "Patch applied to $OPTIONS_FILE. Tail content:"
          tail -n 5 "$OPTIONS_FILE"

      - name: Configure CMake (Cross-Compile Intel Static)
        run: |
          mkdir -p build
          
          TOOLCHAIN_NAME="OLLVM"
          INSTALL_DIR="$(pwd)/${TOOLCHAIN_NAME}.xctoolchain/usr"
          echo "INSTALL_DIR=${INSTALL_DIR}" >> $GITHUB_ENV
          
          # === 配置说明 ===
          # 1. CMAKE_OSX_ARCHITECTURES="x86_64" : 强制生成 Intel 程序
          # 2. CMAKE_OSX_DEPLOYMENT_TARGET=13.0 : 兼容 macOS Ventura (13) 及以上
          # 3. 静态化 (解决崩溃):
          #    CLANG_LINK_CLANG_DYLIB=OFF : 让 clang 独立运行，不依赖 dylib
          #    BUILD_SHARED_LIBS=OFF      : 全局静态
          # 4. Xcode 兼容:
          #    LLVM_BUILD_LLVM_DYLIB=ON   : 生成 libclang.dylib 喂给 Xcode (虽然 clang 不用它)
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            \
            -DCMAKE_INSTALL_DO_STRIP=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build & Install
        run: |
          # 同时安装 clang (静态) 和 libclang (动态库文件)
          cmake --build build --target install-clang install-lld install-libclang install-clang-resource-headers

      - name: Setup Toolchain Structure
        run: |
          cd OLLVM.xctoolchain
          
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.ollvm.toolchain</string>
              <key>CompatibilityVersion</key>
              <integer>2</integer>
              <key>CompatibilityVersionDisplayString</key>
              <string>2.0</string>
              <key>CFBundleDisplayName</key>
              <string>OLLVM 21.0 (Intel Patched)</string>
              <key>CFBundleVersion</key>
              <string>21.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>21.0.0</string>
          </dict>
          </plist>
          EOF
          
          cd usr
          rm -rf lib/*.a lib/cmake include share libexec
          
          # 验证
          echo "=== Final Verification ==="
          echo "[Arch Check] bin/clang:"
          file bin/clang
          echo "[Dylib Check] lib/libclang.dylib:"
          ls -lh lib/libclang.dylib

      - name: Ad-hoc Sign
        run: |
          find OLLVM.xctoolchain/usr -type f \( -name "*.dylib" -o -perm +111 \) -exec codesign --force --deep -s - {} \;

      - name: Compress
        run: |
          tar -cf - OLLVM.xctoolchain | xz -9e -T0 > ollvm-hackintosh-final.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-intel-final-${{ github.run_number }}
          name: OLLVM Intel Final (Patched Source)
          body: |
            **OLLVM Toolchain for Intel Hackintosh (Source Patched)**
            
            **Major Fixes:**
            1. **Fixed `unknown argument: -index-store-path`**: Patched `Options.td` source code to accept Apple's private Xcode arguments.
            2. **Fixed `dyld` Crash**: `clang` is fully static linked (no external dylib dependencies).
            3. **Fixed Cross-Compile**: Built on macOS-latest but targeting Intel x86_64.
            
            **Installation:**
            1. Extract to `~/Library/Developer/Toolchains/`.
            2. Run `xattr -cr ~/Library/Developer/Toolchains/OLLVM.xctoolchain`.
            3. Restart Xcode.
            4. **Note**: If you still see "Explicit modules" warnings, ignore them. The build will succeed because the compiler errors are fixed.
          files: |
            ollvm-hackintosh-final.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
