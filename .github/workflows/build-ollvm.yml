name: Build OLLVM (DYLIB + RTTI) - Perfect Plugin Support

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Clang (DYLIB Mode)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Setup Swap (16GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential xz-utils

      - name: Setup NDK
        run: |
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV

      - name: Configure CMake (DYLIB Mode)
        run: |
          mkdir -p build
          
          # === 核心修复逻辑 ===
          # 1. LLVM_BUILD_LLVM_DYLIB=ON : 生成 libLLVM.so (包含所有符号，解决 vtable 缺失)
          # 2. LLVM_LINK_LLVM_DYLIB=ON  : 让 Clang 链接到 libLLVM.so
          # 3. LLVM_EXPORT_SYMBOLS...=OFF : 必须关闭！因为它与 DYLIB 冲突
          # 4. LLVM_ENABLE_RTTI=ON      : 保持开启，解决 libxVMP 的 typeinfo 问题
          # 5. ANDROID_STL=c++_static   : 依然保持静态链接 libc++，方便移植
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build & Install
        run: |
          # 这一步会消耗较大内存链接 libLLVM.so，但我们有 Swap 且限制了单线程链接
          cmake --build build --target install -j$(nproc)

      - name: Cleanup Artifacts
        run: |
          cd install_output
          # 删除静态库 (.a)，但必须保留 lib/libLLVM.so (核心文件)
          rm -rf lib/*.a 
          
          echo "Check for libLLVM.so:"
          ls -lh lib/libLLVM*.so || echo "WARNING: libLLVM.so not found!"
          
          echo "Final Size:"
          du -sh .

      - name: Compress and Split
        run: |
          tar -cf - -C install_output . | xz -9e -T0 | split -b 400M - "ollvm-dylib.tar.xz."
          ls -lh ollvm-dylib.tar.xz.*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-dylib-${{ github.run_number }}
          name: OLLVM (DYLIB Mode) Build ${{ github.run_number }}
          body: |
            Build of OLLVM for Android (AArch64) with **Full Plugin Support**.
            
            **Configuration:**
            - **Mode**: DYLIB (`libLLVM.so` enabled). This solves `_ZTV` (vtable) errors.
            - **RTTI**: Enabled. This solves `_ZTI` (typeinfo) errors.
            - **STL**: Static (`libc++_static`).
            
            **Important Usage Note:**
            This build relies on `lib/libLLVM.so`.
            When extracting, keep the directory structure (`bin/` and `lib/`).
            If clang fails to run inside Termux, setup library path:
            `export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/path/to/extracted/lib`
          files: |
            ollvm-dylib.tar.xz.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
