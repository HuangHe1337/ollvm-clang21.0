name: Build OLLVM (Static + Release) - Termux Ready

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK Version"
        default: 'r27c'
        required: true

permissions:
  contents: write  # 必须开启，否则无法上传 Release

jobs:
  build:
    name: Build Clang/LLD (Static)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Setup Swap (16GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential xz-utils

      - name: Setup NDK
        run: |
          curl -sSfL -o android-ndk.zip "https://dl.google.com/android/repository/android-ndk-${{ inputs.ndk_version }}-linux.zip"
          unzip -qq android-ndk.zip
          NDK_ROOT=$(pwd)/android-ndk-${{ inputs.ndk_version }}
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV

      - name: Configure CMake (Static & Plugin Support)
        run: |
          mkdir -p build
          
          # === 关键修复 ===
          # 1. ANDROID_STL=c++_static          : 静态链接 libc++，解决 "libc++_shared.so not found"
          # 2. LLVM_STATIC_LINK_CXX_STDLIB=ON  : 再次强制 LLVM 使用静态 C++ 库
          # 3. LLVM_BUILD_TOOLS=OFF            : 不编译杂项工具，只编译 clang/lld
          # 4. LLVM_EXPORT_SYMBOLS...=ON       : 即使静态链接，也导出符号供 Pass 插件使用
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.NDK_ROOT }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_STATIC_LINK_CXX_STDLIB=ON \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/install_output

      - name: Build & Install
        run: |
          # 开始编译
          cmake --build build --target install -j$(nproc)

      - name: Cleanup Artifacts
        run: |
          cd install_output
          # 删除静态库 (.a) 减小体积 (Termux用户不需要这些去二次开发LLVM)
          rm -rf lib/*.a 
          
          echo "Build finished. Final size:"
          du -sh .

      - name: Compress and Split
        run: |
          # 打包 -> xz压缩 -> 分割(400M)
          # 文件名: ollvm-android.tar.xz.aa, ollvm-android.tar.xz.ab ...
          tar -cf - -C install_output . | xz -9e -T0 | split -b 400M - "ollvm-android.tar.xz."
          
          ls -lh ollvm-android.tar.xz.*

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-build-${{ github.run_number }}
          name: OLLVM Build ${{ github.run_number }} (Termux/Android)
          body: |
            Build of OLLVM for Android (AArch64).
            
            **Configuration:**
            - NDK: ${{ inputs.ndk_version }}
            - Projects: Clang, LLD
            - Linking: Static (libc++_static), No dependency on libc++_shared.so
            - Plugin Support: Enabled (Exported Symbols)
            
            **How to use:**
            Download all parts and run:
            `cat ollvm-android.tar.xz.* | tar -xJ`
          files: |
            ollvm-android.tar.xz.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
