name: Build OLLVM (Intel x86_64 Static-Cross)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64 Toolchain
    # 使用目前最稳定的 Arm64 Runner，通过交叉编译生成 Intel 程序
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          brew install ninja cmake
          
      - name: Configure CMake (Cross-Compile Intel)
        run: |
          mkdir -p build
          
          TOOLCHAIN_NAME="OLLVM"
          INSTALL_DIR="$(pwd)/${TOOLCHAIN_NAME}.xctoolchain/usr"
          echo "INSTALL_DIR=${INSTALL_DIR}" >> $GITHUB_ENV
          
          # === 核心修复参数 ===
          # 1. CMAKE_OSX_ARCHITECTURES="x86_64" : 在 M1 机器上强制构建 Intel 版本
          # 2. CMAKE_OSX_DEPLOYMENT_TARGET=13.0 : 确保构建出的程序能在 macOS 13+ (Ventura/Sonoma/Sequoia) 上运行
          # 3. 静态化策略 (解决崩溃):
          #    - BUILD_SHARED_LIBS=OFF      : 全局静态库
          #    - LLVM_LINK_LLVM_DYLIB=OFF   : 工具不连接到 dylib
          #    - CLANG_LINK_CLANG_DYLIB=OFF : Clang 自身静态链接 (100% 修复 Library not loaded)
          # 4. Xcode 兼容策略 (解决 Explicit modules):
          #    - LLVM_BUILD_LLVM_DYLIB=ON   : 虽然不用，但必须生成 .dylib 文件放在那给 Xcode 检查
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            \
            -DCMAKE_INSTALL_DO_STRIP=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build & Install
        run: |
          # 目标解释：
          # install-clang: 安装静态链接的编译器
          # install-libclang: 安装 libclang.dylib (仅作为文件存在，供 Xcode 索引)
          cmake --build build --target install-clang install-lld install-libclang install-clang-resource-headers

      - name: Setup Toolchain Structure
        run: |
          cd OLLVM.xctoolchain
          
          # 1. Info.plist
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.ollvm.toolchain</string>
              <key>CompatibilityVersion</key>
              <integer>2</integer>
              <key>CompatibilityVersionDisplayString</key>
              <string>2.0</string>
              <key>CFBundleDisplayName</key>
              <string>OLLVM 21.0 (Intel)</string>
              <key>CFBundleVersion</key>
              <string>21.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>21.0.0</string>
          </dict>
          </plist>
          EOF
          
          # 2. 清理环境
          cd usr
          # 删除静态库文件(.a)，因为编译器已经包含所有代码，不需要这些垃圾文件
          rm -rf lib/*.a lib/cmake include share libexec
          
          # 3. 终极验证 (在日志里给你看结果)
          echo "=== 验证环节 ==="
          
          # 检查1: 是否是 Intel 架构
          echo "[Check Arch] bin/clang:"
          file bin/clang
          
          # 检查2: 是否依赖 libclang (必须不依赖！否则会崩)
          echo "[Check Clang Dependency] (Should NOT show libclang):"
          otool -L bin/clang | grep libclang || echo "PASS: Clang is static."
          
          # 检查3: 是否存在 libclang.dylib (必须存在！否则 Xcode 报错)
          echo "[Check Dylib Existence]:"
          ls -lh lib/libclang.dylib

      - name: Ad-hoc Sign
        run: |
          # 签名修复权限问题
          find OLLVM.xctoolchain/usr -type f \( -name "*.dylib" -o -perm +111 \) -exec codesign --force --deep -s - {} \;

      - name: Compress
        run: |
          tar -cf - OLLVM.xctoolchain | xz -9e -T0 > ollvm-intel-static.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-intel-fix-${{ github.run_number }}
          name: OLLVM Intel Static Fix (Build ${{ github.run_number }})
          body: |
            **OLLVM Toolchain for Intel Hackintosh (Static Fix)**
            
            This build is specifically engineered to fix the `Library not loaded` crash and Xcode errors.
            
            **Technical Fixes:**
            1. **Cross-Compiled for x86_64**: Built on macOS 14 runner but targeting macOS 13+ Intel.
            2. **Static Executable**: `clang` does NOT depend on `libclang.dylib` anymore. This fixes the `dyld` crash.
            3. **Xcode Compatible**: Includes `libclang.dylib` purely for Xcode's indexer to stop complaining.
            
            **Installation:**
            1. Extract `ollvm-intel-static.tar.xz`.
            2. Move to `~/Library/Developer/Toolchains/`.
            3. **Run Gatekeeper Fix**:
               `xattr -cr ~/Library/Developer/Toolchains/OLLVM.xctoolchain`
            4. Restart Xcode.
          files: |
            ollvm-intel-static.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
