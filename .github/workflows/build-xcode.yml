name: Build OLLVM Xcode Toolchain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Xcode Toolchain (Universal)
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          brew install ninja cmake xz
          
      - name: Configure CMake (Xcode Toolchain Layout)
        run: |
          mkdir -p build
          
          # 定义工具链名称和安装路径
          TOOLCHAIN_NAME="OLLVM"
          INSTALL_DIR="$(pwd)/${TOOLCHAIN_NAME}.xctoolchain/usr"
          
          echo "INSTALL_DIR=${INSTALL_DIR}" >> $GITHUB_ENV
          
          # 注意：
          # 1. CMAKE_INSTALL_PREFIX 指向 .xctoolchain/usr
          # 2. 依然保持 RTTI 和 Plugin 支持
          # 3. 构建 Universal Binary (arm64 + x86_64)
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_ENABLE_LTO=OFF \
            \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCMAKE_INSTALL_DO_STRIP=OFF \
            \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build & Install
        run: |
          cmake --build build --target install

      - name: Create Info.plist
        run: |
          # Xcode 需要 Info.plist 才能识别工具链
          # 我们在 .xctoolchain 根目录下创建它
          
          cd OLLVM.xctoolchain
          
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.ollvm.toolchain</string>
              <key>CompatibilityVersion</key>
              <integer>2</integer>
              <key>CompatibilityVersionDisplayString</key>
              <string>2.0</string>
              <key>CFBundleDisplayName</key>
              <string>OLLVM 21.0</string>
              <key>CFBundleVersion</key>
              <string>21.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>21.0.0</string>
              <key>ReportProblemURL</key>
              <string>https://github.com/lux-QAQ/ollvm-clang21.0</string>
          </dict>
          </plist>
          EOF
          
          echo "Info.plist created."
          cat Info.plist

      - name: Cleanup & Sanitize
        run: |
          cd OLLVM.xctoolchain/usr
          # 清理静态库以减小体积
          rm -rf lib/*.a 
          # 删除 cmake 文件，Xcode 不需要
          rm -rf lib/cmake
          
          # 创建必要的符号链接，确保 Xcode 能找到 c++ 编译器
          # 虽然 cmake install 通常会做，但确保一下
          cd bin
          if [ ! -f "clang++" ]; then ln -s clang clang++; fi
          if [ ! -f "cc" ]; then ln -s clang cc; fi
          if [ ! -f "c++" ]; then ln -s clang c++; fi

      - name: Compress Toolchain
        run: |
          # 打包整个 OLLVM.xctoolchain 文件夹
          tar -cf - OLLVM.xctoolchain | xz -9e -T0 > ollvm-xcode-toolchain.tar.xz
          
          ls -lh ollvm-xcode-toolchain.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-xcode-${{ github.run_number }}
          name: OLLVM Xcode Toolchain (Build ${{ github.run_number }})
          body: |
            **Xcode Toolchain build of OLLVM (macOS Universal)**
            
            Based on Clang 21.0 with Obfuscation features.
            
            ### How to install in Xcode:
            
            1. Download and extract:
               `tar -xf ollvm-xcode-toolchain.tar.xz`
            
            2. Move to the Toolchains directory (create if not exists):
               ```bash
               mkdir -p ~/Library/Developer/Toolchains
               mv OLLVM.xctoolchain ~/Library/Developer/Toolchains/
               ```
               *(Or install system-wide in `/Library/Developer/Toolchains/`)*
            
            3. **Important:** Remove quarantine attribute (fix "unverified developer" error):
               ```bash
               xattr -cr ~/Library/Developer/Toolchains/OLLVM.xctoolchain
               ```
            
            4. Open Xcode, go to **Xcode -> Toolchains** and select **OLLVM 21.0**.
            
            ### Usage:
            Add flags to "Other C Flags" in Build Settings:
            `-mllvm -sub -mllvm -fla -mllvm -bcf`
          files: |
            ollvm-xcode-toolchain.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
