name: Build OLLVM Perfect (Dylib ON + Plugins OFF)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OLLVM (Arm64 + Dylib - Plugins)
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          brew install ninja cmake
          
      - name: Configure CMake (The Golden Config)
        run: |
          mkdir -p build
          
          TOOLCHAIN_NAME="OLLVM"
          INSTALL_DIR="$(pwd)/${TOOLCHAIN_NAME}.xctoolchain/usr"
          echo "INSTALL_DIR=${INSTALL_DIR}" >> $GITHUB_ENV
          
          # === 核心逻辑 ===
          # 1. LLVM_BUILD_LLVM_DYLIB=ON  : 开启！Xcode 必须要有这个才能索引。
          # 2. CLANG_LINK_CLANG_DYLIB=ON : 开启！让 Clang 依赖动态库。
          # 3. LLVM_ENABLE_PLUGINS=OFF   : 关闭！这是解决 runOnNewStackImpl 报错的关键。
          #    (只要关了这个，就不会强制导出内部符号，链接就必定成功)
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            \
            -DCMAKE_INSTALL_DO_STRIP=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build & Install
        run: |
          # 显式指定构建 install-libclang，确保动态库被生成并安装
          cmake --build build --target install-clang install-lld install-libclang install-clang-resource-headers

      - name: Setup Toolchain Structure
        run: |
          cd OLLVM.xctoolchain
          
          # 1. Info.plist
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.ollvm.toolchain</string>
              <key>CompatibilityVersion</key>
              <integer>2</integer>
              <key>CompatibilityVersionDisplayString</key>
              <string>2.0</string>
              <key>CFBundleDisplayName</key>
              <string>OLLVM 21.0</string>
              <key>CFBundleVersion</key>
              <string>21.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>21.0.0</string>
          </dict>
          </plist>
          EOF
          
          # 2. 清理 (千万别删 lib/*.dylib)
          cd usr
          rm -rf lib/*.a lib/cmake include share
          
          # 3. 验证动态库存在 (如果没有，Xcode 就会报 Explicit modules 错)
          if [ -f "lib/libclang.dylib" ]; then
             echo "SUCCESS: libclang.dylib exists!"
          else
             echo "ERROR: libclang.dylib missing!"
             exit 1
          fi
          
          # 4. 符号链接
          cd bin
          if [ ! -f "clang++" ]; then ln -s clang clang++; fi
          if [ ! -f "cc" ]; then ln -s clang cc; fi
          if [ ! -f "c++" ]; then ln -s clang c++; fi

      - name: Ad-hoc Sign Binaries
        run: |
          # 必须对 dylib 进行签名，否则 Xcode 可能会拒绝加载
          find OLLVM.xctoolchain/usr -type f \( -name "*.dylib" -o -perm +111 \) -exec codesign --force --deep -s - {} \;

      - name: Compress
        run: |
          tar -cf - OLLVM.xctoolchain | xz -9e -T0 > ollvm-xcode-final.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-final-${{ github.run_number }}
          name: OLLVM Xcode Toolchain (Perfect Build)
          body: |
            **OLLVM Xcode Toolchain (Arm64 Native)**
            
            **Verification:**
            - Contains `libclang.dylib` -> Fixes "Explicit modules" error.
            - Plugins Disabled -> Fixes linker `runOnNewStackImpl` error.
            - Ad-hoc Signed -> Ready for M1/M2/M3.
            
            **Install:**
            1. `tar -xf ollvm-xcode-final.tar.xz`
            2. `mv OLLVM.xctoolchain ~/Library/Developer/Toolchains/`
            3. `xattr -cr ~/Library/Developer/Toolchains/OLLVM.xctoolchain` (必须执行!)
          files: |
            ollvm-xcode-final.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
