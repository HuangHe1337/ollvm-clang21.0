name: Build OLLVM for Intel/Hackintosh (x86_64)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OLLVM (Intel x86_64)
    # GitHub 的 macos-latest 现在通常是 Arm64，但我们可以交叉编译生成 Intel 版本
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          brew install ninja cmake
          
      - name: Configure CMake (Intel x86_64 Target)
        run: |
          mkdir -p build
          
          TOOLCHAIN_NAME="OLLVM"
          INSTALL_DIR="$(pwd)/${TOOLCHAIN_NAME}.xctoolchain/usr"
          echo "INSTALL_DIR=${INSTALL_DIR}" >> $GITHUB_ENV
          
          # === Intel 黑苹果核心配置 ===
          # 1. CMAKE_OSX_ARCHITECTURES="x86_64" : 强制构建 Intel 版本！
          # 2. LLVM_BUILD_LLVM_DYLIB=ON         : 生成 libclang.dylib (Xcode 必须)
          # 3. LLVM_ENABLE_PLUGINS=OFF          : 关闭插件 (解决链接报错)
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            \
            -DCMAKE_INSTALL_DO_STRIP=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build & Install
        run: |
          # 构建 clang, lld 以及 Xcode 必须的 libclang
          cmake --build build --target install-clang install-lld install-libclang install-clang-resource-headers

      - name: Setup Toolchain Structure
        run: |
          cd OLLVM.xctoolchain
          
          # 1. 生成 Info.plist
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.ollvm.toolchain</string>
              <key>CompatibilityVersion</key>
              <integer>2</integer>
              <key>CompatibilityVersionDisplayString</key>
              <string>2.0</string>
              <key>CFBundleDisplayName</key>
              <string>OLLVM 21.0 (Intel)</string>
              <key>CFBundleVersion</key>
              <string>21.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>21.0.0</string>
          </dict>
          </plist>
          EOF
          
          # 2. 清理无用文件 (保留 lib/*.dylib)
          cd usr
          rm -rf lib/*.a lib/cmake include share libexec
          
          # 3. 验证构建结果 (确保 libclang.dylib 存在)
          if [ -f "lib/libclang.dylib" ]; then
             echo "Verification Passed: libclang.dylib exists."
          else
             echo "Error: libclang.dylib missing!"
             exit 1
          fi
          
          # 4. 检查架构 (确保是 x86_64)
          file bin/clang
          
          # 5. 符号链接
          cd bin
          if [ ! -f "clang++" ]; then ln -s clang clang++; fi
          if [ ! -f "cc" ]; then ln -s clang cc; fi
          if [ ! -f "c++" ]; then ln -s clang c++; fi

      - name: Ad-hoc Sign Binaries
        run: |
          # 即使是黑苹果，签名也能减少很多权限弹窗问题
          find OLLVM.xctoolchain/usr -type f \( -name "*.dylib" -o -perm +111 \) -exec codesign --force --deep -s - {} \;

      - name: Compress
        run: |
          tar -cf - OLLVM.xctoolchain | xz -9e -T0 > ollvm-intel-xcode.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-intel-${{ github.run_number }}
          name: OLLVM for Intel/Hackintosh (x86_64)
          body: |
            **OLLVM Xcode Toolchain (Intel x86_64)**
            
            Optimized for Intel Macs and Hackintosh.
            
            **Features:**
            - **Architecture**: Native `x86_64` (Runs perfectly on Intel CPUs).
            - **Xcode Ready**: Includes `libclang.dylib` to support Xcode "Explicit Modules".
            - **Stable**: Plugins disabled to prevent linker errors.
            
            **Installation:**
            1. Download `ollvm-intel-xcode.tar.xz`.
            2. Extract and move `OLLVM.xctoolchain` to `~/Library/Developer/Toolchains/`.
            3. **Gatekeeper Fix**:
               ```bash
               xattr -cr ~/Library/Developer/Toolchains/OLLVM.xctoolchain
               ```
            4. Select "OLLVM 21.0 (Intel)" in Xcode.
          files: |
            ollvm-intel-xcode.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
