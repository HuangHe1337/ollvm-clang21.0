name: Build OLLVM for Xcode (Fixed Dylib)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OLLVM (Arm64 + Dylib)
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          brew install ninja cmake
          
      - name: Configure CMake (Xcode Compatible)
        run: |
          mkdir -p build
          
          TOOLCHAIN_NAME="OLLVM"
          INSTALL_DIR="$(pwd)/${TOOLCHAIN_NAME}.xctoolchain/usr"
          echo "INSTALL_DIR=${INSTALL_DIR}" >> $GITHUB_ENV
          
          # === 关键修正策略 ===
          # 1. LLVM_BUILD_LLVM_DYLIB=ON  : 必须开启！Xcode 需要 libLLVM/libclang.dylib
          # 2. CLANG_LINK_CLANG_DYLIB=ON : 让 Clang 链接到动态库，减小体积并符合 Xcode 规范
          # 3. LLVM_ENABLE_PLUGINS=OFF   : 关键！关闭插件支持。
          #    这解决了 "undefined symbol: runOnNewStackImpl" 报错，
          #    同时因为 OLLVM 源码已内置，我们不需要插件也能混淆。
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            \
            -DCMAKE_INSTALL_DO_STRIP=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build & Install
        run: |
          # 编译 Clang、LLD 和最重要的 libclang
          cmake --build build --target install-clang install-lld install-libclang install-clang-resource-headers

      - name: Setup Toolchain Structure
        run: |
          cd OLLVM.xctoolchain
          
          # 1. Info.plist
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.ollvm.toolchain</string>
              <key>CompatibilityVersion</key>
              <integer>2</integer>
              <key>CompatibilityVersionDisplayString</key>
              <string>2.0</string>
              <key>CFBundleDisplayName</key>
              <string>OLLVM 21.0 (Dylib)</string>
              <key>CFBundleVersion</key>
              <string>21.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>21.0.0</string>
              <key>ReportProblemURL</key>
              <string>https://github.com/lux-QAQ/ollvm-clang21.0</string>
          </dict>
          </plist>
          EOF
          
          # 2. 清理 (注意：这次不能删 lib/*.dylib)
          cd usr
          # 仅删除静态库 (.a) 和 cmake 脚本
          rm -rf lib/*.a lib/cmake
          # 删除不需要的工具 (如 llvm-config 等，如果有残留)
          rm -rf share libexec
          
          # 3. 检查动态库是否存在 (调试用)
          echo "Checking for libclang.dylib..."
          find lib -name "libclang.dylib"
          
          # 4. 符号链接
          cd bin
          if [ ! -f "clang++" ]; then ln -s clang clang++; fi
          if [ ! -f "cc" ]; then ln -s clang cc; fi
          if [ ! -f "c++" ]; then ln -s clang c++; fi

      - name: Ad-hoc Sign Binaries
        run: |
          # 签名所有二进制和动态库
          find OLLVM.xctoolchain/usr -type f \( -name "*.dylib" -o -perm +111 \) -exec codesign --force --deep -s - {} \;

      - name: Compress
        run: |
          tar -cf - OLLVM.xctoolchain | xz -9e -T0 > ollvm-dylib-arm64.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-dylib-${{ github.run_number }}
          name: OLLVM Xcode Toolchain (With Dylib)
          body: |
            **OLLVM Xcode Toolchain (Arm64 Native + Dylib)**
            
            **Fixes:**
            - Solves `Explicit modules is enabled but could not resolve libclang.dylib`.
            - Contains `libclang.dylib` required by Xcode 15/16.
            - `Plugins` disabled to prevent linker errors (OLLVM is built-in).
            
            **Installation:**
            
            1. Extract `ollvm-dylib-arm64.tar.xz`.
            2. Move `OLLVM.xctoolchain` to `~/Library/Developer/Toolchains/`.
            3. **Gatekeeper Fix (Required):**
               ```bash
               xattr -cr ~/Library/Developer/Toolchains/OLLVM.xctoolchain
               ```
          files: |
            ollvm-dylib-arm64.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
