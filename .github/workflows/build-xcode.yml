name: Build OLLVM Xcode Toolchain (Linker Fix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OLLVM (Arm64 Native)
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          brew install ninja cmake
          
      - name: Configure CMake (Fix Linker Error)
        run: |
          mkdir -p build
          
          TOOLCHAIN_NAME="OLLVM"
          INSTALL_DIR="$(pwd)/${TOOLCHAIN_NAME}.xctoolchain/usr"
          echo "INSTALL_DIR=${INSTALL_DIR}" >> $GITHUB_ENV
          
          # === 关键修复 ===
          # 1. LLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF : ！！！关键！！！
          #    关闭它以解决 "referenced from: <initial-undefines>" 错误。
          # 2. CMAKE_EXE_LINKER_FLAGS="-Wl,-export_dynamic" : 
          #    替代方案。暴力导出符号，确保插件依然能找到需要的函数。
          # 3. 保持 ZSTD/LibXML2 关闭，防止库版本冲突。
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-export_dynamic" \
            \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_PLUGINS=ON \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCMAKE_INSTALL_DO_STRIP=ON \
            \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build & Install
        run: |
          cmake --build build --target install

      - name: Setup Toolchain Structure
        run: |
          cd OLLVM.xctoolchain
          
          # 创建 Info.plist
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.ollvm.toolchain</string>
              <key>CompatibilityVersion</key>
              <integer>2</integer>
              <key>CompatibilityVersionDisplayString</key>
              <string>2.0</string>
              <key>CFBundleDisplayName</key>
              <string>OLLVM 21.0 (Arm64)</string>
              <key>CFBundleVersion</key>
              <string>21.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>21.0.0</string>
              <key>ReportProblemURL</key>
              <string>https://github.com/lux-QAQ/ollvm-clang21.0</string>
          </dict>
          </plist>
          EOF
          
          # 清理
          cd usr
          rm -rf lib/*.a lib/cmake include share
          
          # 链接
          cd bin
          if [ ! -f "clang++" ]; then ln -s clang clang++; fi
          if [ ! -f "cc" ]; then ln -s clang cc; fi
          if [ ! -f "c++" ]; then ln -s clang c++; fi

      - name: Ad-hoc Sign Binaries
        run: |
          # 修复 "killed: 9" 错误
          find OLLVM.xctoolchain/usr/bin -type f -perm +111 -exec codesign --force --deep -s - {} \;

      - name: Compress
        run: |
          tar -cf - OLLVM.xctoolchain | xz -9e -T0 > ollvm-arm64-xcode.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-fix-${{ github.run_number }}
          name: OLLVM for Xcode (Linker Fix)
          body: |
            **OLLVM Xcode Toolchain (Arm64 Native)**
            
            **Fixed:**
            - Solved `Undefined symbols: llvm::runOnNewStackImpl` linker error by disabling explicit symbol export list.
            - Plugins support enabled via `-Wl,-export_dynamic`.
            
            ### Installation:
            1. Download & Extract `ollvm-arm64-xcode.tar.xz`.
            2. Move `OLLVM.xctoolchain` to `~/Library/Developer/Toolchains/`.
            3. **Run this command**:
               ```bash
               xattr -cr ~/Library/Developer/Toolchains/OLLVM.xctoolchain
               ```
            4. Select "OLLVM 21.0 (Arm64)" in Xcode Toolchains menu.
          files: |
            ollvm-arm64-xcode.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
