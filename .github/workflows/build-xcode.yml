name: Build OLLVM Static (Arm64 Xcode)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Static OLLVM (Arm64)
    runs-on: macos-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: lux-QAQ/ollvm-clang21.0
          ref: clang+ollvm-21.0.0
          path: llvm-project
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          brew install ninja cmake
          
      - name: Configure CMake (Static Mode)
        run: |
          mkdir -p build
          
          TOOLCHAIN_NAME="OLLVM"
          INSTALL_DIR="$(pwd)/${TOOLCHAIN_NAME}.xctoolchain/usr"
          echo "INSTALL_DIR=${INSTALL_DIR}" >> $GITHUB_ENV
          
          # === 静态链接核心配置 ===
          # 1. BUILD_SHARED_LIBS=OFF      : 强制所有库静态编译 (.a)
          # 2. LLVM_BUILD_LLVM_DYLIB=OFF  : 不生成 libLLVM.dylib
          # 3. CLANG_LINK_CLANG_DYLIB=OFF : 强制 Clang 链接静态库 (.a) 而非动态库
          # 4. LLVM_ENABLE_PLUGINS=OFF    : 关闭插件支持，彻底避免符号导出问题
          
          cmake -G Ninja -S llvm-project/llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_CXX_FLAGS="-g0 -DNDEBUG" \
            -DCMAKE_C_FLAGS="-g0 -DNDEBUG" \
            \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86" \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            -DLLVM_ENABLE_PLUGINS=OFF \
            -DLLVM_EXPORT_SYMBOLS_FOR_PLUGINS=OFF \
            \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            \
            -DLLVM_ENABLE_LTO=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_RTTI=ON \
            \
            -DCMAKE_INSTALL_DO_STRIP=ON \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build & Install
        run: |
          # 仅构建 install-clang install-lld 以及必要的头文件
          # 避免构建 llvm-ar 等不必要的工具，节省时间
          cmake --build build --target install-clang install-lld install-clang-resource-headers

      - name: Setup Toolchain Structure
        run: |
          cd OLLVM.xctoolchain
          
          # 1. 创建 Info.plist
          cat > Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>org.ollvm.toolchain</string>
              <key>CompatibilityVersion</key>
              <integer>2</integer>
              <key>CompatibilityVersionDisplayString</key>
              <string>2.0</string>
              <key>CFBundleDisplayName</key>
              <string>OLLVM 21.0 (Static)</string>
              <key>CFBundleVersion</key>
              <string>21.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>21.0.0</string>
              <key>ReportProblemURL</key>
              <string>https://github.com/lux-QAQ/ollvm-clang21.0</string>
          </dict>
          </plist>
          EOF
          
          # 2. 深度清理
          cd usr
          # 删除所有静态库 (.a)，因为代码已经链接进可执行文件了，Xcode 不需要这些 .a 文件
          rm -rf lib/*.a lib/cmake lib/*.dylib
          # 删除无关文件夹
          rm -rf include share libexec
          
          # 3. 补全符号链接
          cd bin
          if [ ! -f "clang++" ]; then ln -s clang clang++; fi
          if [ ! -f "cc" ]; then ln -s clang cc; fi
          if [ ! -f "c++" ]; then ln -s clang c++; fi

      - name: Ad-hoc Sign Binaries
        run: |
          # 签名是 Xcode 识别工具链的关键
          find OLLVM.xctoolchain/usr/bin -type f -perm +111 -exec codesign --force --deep -s - {} \;
          
          # 验证没有动态库残留
          echo "Checking for dylibs (should be empty):"
          find OLLVM.xctoolchain -name "*.dylib"

      - name: Compress
        run: |
          tar -cf - OLLVM.xctoolchain | xz -9e -T0 > ollvm-static-arm64.tar.xz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ollvm-static-${{ github.run_number }}
          name: OLLVM Static Build (Arm64)
          body: |
            **OLLVM Static Xcode Toolchain (Arm64 Native)**
            
            This is a **purely static build**. No `libclang.dylib` or extra dependencies.
            
            **Installation:**
            
            1. Download & Extract:
               `tar -xf ollvm-static-arm64.tar.xz`
            
            2. Install:
               `mv OLLVM.xctoolchain ~/Library/Developer/Toolchains/`
            
            3. **Fix Gatekeeper (Required):**
               ```bash
               xattr -cr ~/Library/Developer/Toolchains/OLLVM.xctoolchain
               ```
               
            4. Enable in Xcode Toolchains menu.
          files: |
            ollvm-static-arm64.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
